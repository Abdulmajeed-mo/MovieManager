<div class="mx-auto mt-16 w-full max-w-md px-6">
  <div class="rounded-xl border border-gray-800 bg-gray-900 p-8">
    <h1 class="mb-2 text-2xl font-bold text-white">
      Login
    </h1>

    <p class="mb-6 text-sm text-gray-400">
      Enter your email and password to continue.
    </p>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="login()"
      class="space-y-5"
    >
      <div>
        <label class="mb-2 block text-sm text-gray-300">
          Email
        </label>

        <input
          type="email"
          formControlName="identifier"
          class="w-full rounded-lg border border-gray-700 bg-gray-950 px-4 py-3 text-white outline-none focus:border-red-500"
          placeholder="Enter your email"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm text-gray-300">
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          class="w-full rounded-lg border border-gray-700 bg-gray-950 px-4 py-3 text-white outline-none focus:border-red-500"
          placeholder="Enter your password"
        />
      </div>

         <button
        type="submit"
        class="w-full rounded-lg bg-red-600 px-4 py-3 font-semibold text-white hover:bg-red-700"
      >
        Login
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-400">
      Don't have an account?
      <a
        routerLink="/register"
        class="font-semibold text-red-500 hover:text-red-400"
      >
        Create an account
      </a>
    </p>
  </div>
</div>
